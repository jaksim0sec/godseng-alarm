name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: python3 scripts/check_parity.py
      - run: python3 scripts/check_native_integrations.py
      - run: python3 scripts/check_features.py
      - run: python3 scripts/check_inline_js.py
      - run: node --check app/src/main/assets/native-adapter.js
      - run: node --check app/src/main/assets/features.js
      - run: node scripts/test_native_adapter.js
      - run: node scripts/test_features.js
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: godseng-alarm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
