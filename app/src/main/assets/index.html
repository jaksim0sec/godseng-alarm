<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>갓생알리미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --g1:#141414; --g2:#222; --g3:#5c5c5c; --g4:#9a9a9a; --fg:#f5f5f5;
  --e:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  height:100%;
}
:root[data-theme="dark"]{--bg:#000}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{height:100%;font-family:"Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.02em;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}

.app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;overflow:clip}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:20px 22px 22px;opacity:0;transform:translateX(28px);pointer-events:none;transition:opacity .4s ease,transform .55s var(--e)}
.scr.on{opacity:1;transform:none;pointer-events:auto}
/* 비활성 화면의 자식 요소가 투명한 상태로 터치를 가로채지 않도록 차단 */
.scr:not(.on),.scr:not(.on) *{pointer-events:none!important}
.scr.out{transform:translateX(-28px)}
.scr.on .rise{animation:rise .8s var(--e) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

h1{font-size:32px;line-height:1.28;font-weight:800;margin:0;letter-spacing:-.04em}
.sub{color:var(--g4);font-size:15px;line-height:1.55;margin:12px 0 0}
.eyebrow{color:var(--g4);font-size:15px;font-weight:500;margin:0 0 8px}
.grow{flex:1}

.cta{width:100%;height:58px;border-radius:999px;background:var(--fg);color:#000;font-size:17px;font-weight:700;transition:background .35s var(--e),color .35s var(--e),transform .15s}
.cta:active{transform:scale(.98)}
.cta:disabled{background:var(--g2);color:var(--g3);cursor:default}

/* hero */
#s-hero{text-align:center;overflow:hidden}
#s-hero .hc{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
#s-hero h1{font-size:38px;line-height:1.24;position:relative}
#s-hero h1 .ln{display:block}
#s-hero .sub{position:relative}
#s-hero.on h1 .ln{animation:blurin 1.1s var(--e) both;animation-delay:var(--d)}
#s-hero.on .sub{animation:blurin 1s var(--e) .75s both}
#s-hero.on .cta{animation:rise .9s var(--e) 1.05s both}
@keyframes blurin{from{opacity:0;filter:blur(10px);transform:translateY(10px)}}
.glow{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 65%);animation:breathe 7s ease-in-out infinite;pointer-events:none}
@keyframes breathe{50%{transform:scale(1.18);opacity:.5}}
.sheen{position:relative;overflow:hidden}
.sheen::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(0,0,0,.09) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 4.2s ease-in-out 2.4s infinite}
@keyframes sheen{35%,100%{transform:translateX(100%)}}

/* perm */
.perm{margin-top:48px;display:flex;flex-direction:column;gap:10px}
.pi{display:flex;align-items:center;gap:14px;background:var(--g1);border-radius:20px;padding:16px}
.pi .pic{width:42px;height:42px;border-radius:50%;background:var(--g2);display:grid;place-items:center;flex:none}
.pi b{display:block;font-size:15px;font-weight:700}
.pi span{display:block;font-size:13px;color:var(--g4);margin-top:3px}
.pi .tx{flex:1}
.pst{width:24px;height:24px;flex:none;position:relative}
.pst .spin{position:absolute;inset:2px;border-radius:50%;border:2px solid var(--g2);border-top-color:var(--g4);animation:sp .8s linear infinite}
.pst .ok{position:absolute;inset:0;border-radius:50%;background:var(--fg);color:#000;display:grid;place-items:center;transform:scale(0);transition:transform .45s var(--e)}
.pst .ok svg{width:14px;height:14px;stroke-width:2.6}
.pi.done .spin{opacity:0}
.pi.done .ok{transform:scale(1)}
@keyframes sp{to{transform:rotate(360deg)}}

/* pick */
.obar{display:flex;align-items:center;gap:14px;height:48px;margin:4px 0 22px}
.ob{width:46px;height:46px;border-radius:50%;background:var(--g1);display:grid;place-items:center;color:var(--fg);transition:transform .15s,background .2s}
.ob:active{transform:scale(.92);background:var(--g2)}
.ostep{font-size:14px;color:var(--g3);font-weight:600;font-variant-numeric:tabular-nums}
.fwrap{flex:1;display:flex;flex-direction:column;justify-content:center}
.flow{position:relative;display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:24px calc(50% - 58px) 60px;margin:0 -22px;scrollbar-width:none}
.flow::-webkit-scrollbar{display:none}
.fi{flex:0 0 116px;height:116px;scroll-snap-align:center;position:relative;cursor:pointer;border:0;background:transparent;padding:0;display:block;text-align:initial;appearance:none;-webkit-appearance:none}
.fi .tile{border-radius:34px;background:var(--g1);transition:background .3s}
.fi.c .tile{background:var(--g2)}
.fi .fl{position:absolute;top:100%;left:-24px;right:-24px;margin-top:16px;text-align:center;font-size:17px;font-weight:700;color:var(--g4);transition:color .3s}
.fi.c .fl{color:var(--fg)}
.tile{width:100%;height:100%;border-radius:28%;background:var(--g2);display:grid;place-items:center;color:var(--fg)}
.tile svg{width:44%;height:44%;stroke-width:1.7}
.fi .badge{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--fg);color:#000;display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--e)}
.fi .badge svg{width:14px;height:14px;stroke-width:2.8}
.fi.sel .badge{transform:scale(1)}
.fi.sel .tile{background:#2e2e2e}
.fstat{text-align:center;min-height:24px}
.fstat b{display:block;font-size:15px;font-weight:500;color:var(--g4)}
.fstat span{display:block;font-size:13px;color:var(--g3);margin-top:4px}
.dots{display:flex;justify-content:center;align-items:center;gap:7px;height:8px;margin:0 0 28px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--g2);transition:width .45s var(--e),background .35s}
.dots i.s{background:var(--g3)}
.dots i.c{width:24px;background:var(--fg)}
.fnote{text-align:center;font-size:13px;color:var(--g3);margin:14px 0 0}

/* method */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.mc{background:var(--g1);border-radius:22px;padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:14px;min-height:0;transition:background .4s var(--e),color .4s var(--e),transform .15s}
.mc:active{transform:scale(.98)}
.mc .mi{width:36px;height:36px;border-radius:50%;background:var(--g2);display:grid;place-items:center;transition:background .4s}
.mc .mi svg{width:20px;height:20px}
.mc b{font-size:16px;line-height:1.35;font-weight:700}
.mc b em{font-style:normal;transition:opacity .2s}
.mc span{font-size:13px;line-height:1.45;color:var(--g4);margin-top:auto;transition:color .4s}
.mc.sel{background:var(--fg);color:#000}
.mc.sel .mi{background:#e2e2e2}
.mc.sel.editing .mi{background:#111;color:#fff}
.mc.sel span{color:#555}
.pzone{position:relative;margin-top:14px;height:140px;overflow:hidden}
.pz{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .5s var(--e);pointer-events:none}
.pz.on{opacity:1;transform:none;pointer-events:auto}
.pz.hint{color:var(--g3);font-size:14px}
.pk{position:relative;display:flex;align-items:center;gap:4px;padding:0 10px}
.pk::before{content:"";position:absolute;left:0;right:0;top:50%;height:40px;margin-top:-20px;background:var(--g1);border-radius:12px}
.wheel{position:relative;height:132px;width:56px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 38%,#000 62%,transparent);mask-image:linear-gradient(transparent,#000 38%,#000 62%,transparent)}
.wheel.wide{width:84px}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:46px}
.wheel .w{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;font-size:19px;color:var(--g3);font-variant-numeric:tabular-nums;transition:color .2s}
.wheel .w.sel{color:var(--fg);font-weight:700}
.pk .sep{position:relative;color:var(--g4);font-size:18px;font-weight:500}
.pk .lbl{position:relative;color:var(--g4);font-size:15px;padding:0 4px}
.chk{display:flex;align-items:center;gap:10px;margin:0 auto 14px;font-size:14px;color:var(--g4)}
.chk .bx{width:22px;height:22px;border-radius:7px;background:var(--g2);display:grid;place-items:center;color:#000;transition:background .3s var(--e)}
.chk .bx svg{width:14px;height:14px;stroke-width:2.8;opacity:0;transform:scale(.5);transition:all .3s var(--e)}
.chk.on{color:var(--fg)}
.chk.on .bx{background:var(--fg)}
.chk.on .bx svg{opacity:1;transform:none}

/* home */
#s-home{padding:0}
.hhead{padding:6px 18px 0;flex:none}
.nav{display:flex;align-items:center;justify-content:space-between;height:76px;transition:height .45s var(--e),opacity .3s ease,transform .45s var(--e);overflow:hidden}
.nav h2{font-size:29px;font-weight:800;margin:0;letter-spacing:-.04em}
.nbtns{display:flex;gap:22px;margin-right:2px}
.nb{display:grid;place-items:center;color:var(--fg);transition:opacity .2s,transform .2s}
.nb svg.i{width:30px;height:30px;stroke-width:1.8}
.nb:active{opacity:.5;transform:scale(.92)}
.filt{display:flex;gap:8px;margin:6px 0 16px}
.fp{height:38px;padding:0 16px;border-radius:999px;background:var(--g1);color:var(--g3);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .35s var(--e),color .35s var(--e),transform .15s}
.fp:active{transform:scale(.96)}
.fp em{font-style:normal;font-weight:500;opacity:.65}
.fp.on{background:var(--fg);color:#000}
.srow{display:flex;align-items:center;padding:6px 0 14px}
.back{width:0;height:46px;opacity:0;overflow:hidden;display:grid;place-items:center;flex:none;transition:width .45s var(--e),opacity .3s ease,margin .45s var(--e);color:var(--fg)}
.sbar{flex:1;height:48px;border-radius:999px;background:var(--g2);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--g4)}
.sbar input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--fg);font:inherit;font-size:16px;letter-spacing:inherit}
.sbar input::placeholder{color:var(--g3)}
.sclear{color:var(--g3);opacity:0;transition:opacity .2s;pointer-events:none}
.sclear.on{opacity:1;pointer-events:auto}
#s-home.searching .nav{height:0;opacity:0;transform:translateY(-14px)}
#s-home.searching .back{width:40px;opacity:1;margin-right:6px}
.hbody{flex:1;overflow-y:auto;padding:4px 18px 28px;scrollbar-width:none}
.hbody::-webkit-scrollbar{display:none}
.hmeta{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 12px;font-size:14px;color:var(--g4)}
.hmeta b{color:var(--fg);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{position:relative;min-width:0;background:var(--g1);border-radius:24px;padding:18px 16px 16px;display:flex;flex-direction:column;cursor:pointer;animation:rise .7s var(--e) both;transition:transform .15s,opacity .4s}
.card:active{transform:scale(.985)}
.card.hide{display:none}
.card .top{display:flex;justify-content:space-between;align-items:flex-start}
.card .tile{width:auto;height:auto;background:none;border-radius:0;place-items:start;transition:opacity .4s}
.card .tile svg{width:30px;height:30px;stroke-width:1.7}
.keb{width:32px;height:32px;margin:-4px -6px 0 0;border-radius:50%;display:grid;place-items:center;color:var(--g4)}
.keb:active{background:var(--g2)}
.card .nm{font-size:17px;font-weight:700;margin:22px 0 0;transition:color .4s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--g2);font-size:12px;font-weight:500;color:var(--fg);transition:all .4s var(--e)}
.st i{width:6px;height:6px;border-radius:50%;background:var(--fg);transition:background .4s}
.card .foot{display:flex;justify-content:flex-end;align-items:center;margin-top:20px}
.mini{display:flex;gap:4px;min-width:0;overflow:hidden}
.mini span{width:22px;height:22px;border-radius:50%;background:var(--g2);display:grid;place-items:center;color:var(--g4);flex:none}
.mini span svg.i{width:12px;height:12px;stroke-width:2.2}
.mini span.now{background:var(--fg);color:#000}
.card.off .mini{opacity:.35}
.csw{flex:none}
.tr{display:flex;align-items:center;gap:2px}
.pinb{color:var(--g4);margin-top:-4px}
.pinb svg.i{width:15px;height:15px}
.sheet .shk{font-size:13px;color:var(--g4);font-weight:600;margin:0 0 10px}
.qset{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.qb{height:44px;border-radius:14px;background:var(--g2);font-size:14px;font-weight:700;color:var(--g4);transition:background .25s,color .25s,transform .15s}
.qb:active{transform:scale(.95)}
.qb.on{background:var(--fg);color:#000}
.srl{display:flex;align-items:center;gap:10px}
.sheet .srl svg.i{width:19px;height:19px;color:var(--fg);flex:none}
.sheet .sr{padding:0 18px 0 20px}

/* 인사이트 */
#s-insight{padding-bottom:0}
#ibody{flex:1;min-height:0;overflow-y:auto;margin:0 -22px;padding:0 22px 28px;scrollbar-width:none}
#ibody::-webkit-scrollbar{display:none}
.isum{font-size:31px;line-height:1.3;font-weight:800;letter-spacing:-.04em;color:var(--g3);margin:0}
.isum b{color:var(--fg)}
.isub{font-size:16px;color:var(--g4);margin:12px 0 28px}
.isub b{color:var(--fg);font-weight:700}
.iblk{background:var(--g1);border-radius:22px;padding:18px;margin-bottom:10px}
.ih{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;gap:10px}
.ih .k{font-size:13px;color:var(--g4)}
.ih b{font-size:15px;font-weight:700}
.hstrip{display:flex;align-items:flex-end;gap:3px;height:58px}
.hstrip i{flex:1;border-radius:3px;background:var(--g2);transform-origin:bottom;animation:grow .8s var(--e) both}
.hstrip i.hp{background:var(--fg)}
.hlab{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--g3)}
.rk{display:flex;align-items:center;gap:12px;padding:9px 0}
.rk strong{width:16px;font-size:15px;font-weight:800;color:var(--g3);font-variant-numeric:tabular-nums;flex:none}
.rk:first-child strong{color:var(--fg)}
.rk>svg.i{width:20px;height:20px;flex:none}
.rk .rb{flex:1;min-width:0}
.rk .rb b{display:block;font-size:15px;font-weight:600}
.rk .rb span{display:block;height:4px;border-radius:2px;background:var(--g2);margin-top:7px;overflow:hidden}
.rk .rb span i{display:block;height:100%;border-radius:2px;background:var(--g3);transform-origin:left;animation:growx .9s var(--e) both}
.rk:first-child .rb span i{background:var(--fg)}
.rk em{font-style:normal;font-size:13px;color:var(--g4);font-variant-numeric:tabular-nums;white-space:nowrap}
@keyframes growx{from{transform:scaleX(0)}}
.rk .rb b{display:flex;align-items:center;gap:8px}
.rd{display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;min-width:38px;font-size:14px;font-weight:700;color:var(--g3);font-variant-numeric:tabular-nums;animation:rise .6s var(--e) .7s both}
.rk .rb b em{font-weight:500}
.rd svg{width:14px;height:14px;fill:currentColor}
.rd.up{color:#ff5a5a}
.rd.dn{color:#4d8dff}
.sheet .sr.dz{padding:0}
.use{font-size:13px;color:var(--g3);margin-top:4px}
.act{height:32px;padding:0 12px;border-radius:999px;background:var(--g2);color:var(--g4);font-size:13px;font-weight:600;white-space:nowrap;transition:background .4s var(--e),color .4s var(--e)}
.card.off .tile{opacity:.4}
.card.off .nm{color:var(--g4)}
.card.off .st{background:#1a1a1a;color:var(--g3)}
.card.off .st i{background:var(--g3)}
.card.off .act{background:var(--fg);color:#000}
.menu{position:absolute;top:44px;right:10px;z-index:5;background:var(--g2);border-radius:16px;padding:6px;min-width:132px;opacity:0;transform:scale(.92) translateY(-6px);transform-origin:top right;pointer-events:none;transition:all .25s var(--e);box-shadow:0 12px 30px rgba(0,0,0,.6)}
.menu.on{opacity:1;transform:none;pointer-events:auto}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px}
.menu button:active{background:#2e2e2e}
.menu .dz{color:var(--g4)}
.empty{display:none;text-align:center;color:var(--g3);font-size:14px;padding:60px 0}
.empty.on{display:block}

/* home shortcuts */
.home-tools{display:flex;align-items:center;justify-content:flex-end;margin:-2px 0 14px}
.preview-action{height:37px;display:inline-flex;align-items:center;gap:7px;border-radius:999px;background:var(--g1);color:var(--fg);padding:0 14px;font-size:13px;font-weight:600}
.preview-action svg.i{width:17px;height:17px}
.add-fab{position:absolute;right:22px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:8;width:58px;height:58px;border-radius:50%;background:var(--fg);color:#000;display:grid;place-items:center;box-shadow:0 8px 25px #0008;transition:transform .2s var(--e)}
.add-fab svg.i{width:27px;height:27px;stroke-width:2.2}
.add-fab:active{transform:scale(.93)}
.add-backdrop{position:absolute;inset:0;z-index:24;background:#000b;opacity:0;pointer-events:none;transition:opacity .3s}
.add-panel{position:absolute;bottom:0;left:0;right:0;z-index:25;background:var(--g1);border-radius:28px 28px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .4s var(--e);max-height:75%;display:flex;flex-direction:column}
.app.add-open .add-backdrop{opacity:1;pointer-events:auto}
.app.add-open .add-panel{transform:none}
.add-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.add-title h3{margin:0;font-size:23px;font-weight:800}
.add-close{width:38px;height:38px;border-radius:50%;background:var(--g2);display:grid;place-items:center}
.add-desc{font-size:13px;color:var(--g4);margin:0 0 16px}
.add-list{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.add-item{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:18px;background:var(--g2);text-align:left}
.add-item .tile{width:42px;height:42px;border-radius:14px;flex:none}
.add-item .tile svg{width:24px;height:24px}
.add-item b{flex:1;font-size:15px}
.add-item span{font-size:13px;color:var(--g4)}
.add-item:active{background:#333}
/* detail */
.dtop{height:56px;display:flex;align-items:center;margin:-8px -8px 0}
.dtop .back{width:44px;opacity:1}
.dhead{display:flex;align-items:center;gap:16px;margin:10px 0 24px}
.dhead .tile{width:64px;height:64px;border-radius:20px;flex:none}
.dhead h2{font-size:26px;font-weight:800;margin:0 0 8px;letter-spacing:-.04em}
.blk{background:var(--g1);border-radius:22px;padding:18px;margin-bottom:10px}
.blk .k{font-size:13px;color:var(--g4)}
.blk .v{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-.04em}
.bars{display:flex;align-items:flex-end;gap:8px;height:70px;margin-top:18px}
.bars div{flex:1;border-radius:6px;background:var(--g2);transform-origin:bottom;animation:grow .8s var(--e) both}
.bars div.t{background:var(--fg)}
.blabels{display:flex;gap:8px;margin-top:8px}
.blabels span{flex:1;text-align:center;font-size:11px;color:var(--g3)}
@keyframes grow{from{transform:scaleY(0)}}
.row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.row+.row{margin-top:12px}
.row .k{font-size:14px}
.row .rv{font-size:14px;color:var(--fg);font-weight:600;max-width:68%;text-align:right;line-height:1.5;overflow-wrap:break-word}
#s-detail{padding-bottom:0}
#dbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;margin:0 -22px;padding:0 22px;scrollbar-width:none}
#dbody::-webkit-scrollbar{display:none}
.dbtns{position:sticky;bottom:0;z-index:2;flex:none;display:flex;gap:10px;margin-top:auto;padding:18px 0 24px;background:linear-gradient(transparent,var(--bg) 32%)}
.btn2{flex:1;height:58px;border-radius:999px;background:var(--g2);font-size:16px;font-weight:700;color:var(--fg)}
.dbtns .cta{flex:1}
.dbtns .cta.offs{background:var(--g2);color:#ff6b6b}
.wh{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}
.conds{display:flex;flex-wrap:wrap;gap:6px}
.cpill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;border-radius:999px;background:var(--g2);font-size:13px;font-weight:600}
.cpill svg.i{width:15px;height:15px;color:var(--g4)}
.cpill.dim{color:var(--g3)}
.chain{display:flex;margin-top:22px}
.cn{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.cn::before{content:"";position:absolute;top:19px;right:50%;width:100%;height:2px;background:var(--g2)}
.cn:first-child::before{display:none}
.cn .sic{position:relative;z-index:1;width:40px;height:40px;transition:background .4s var(--e),color .4s var(--e),transform .4s var(--e)}
.cn b{font-size:12px;font-weight:600;color:var(--g4);white-space:nowrap;transition:color .3s}
.cn small{font-size:11px;color:var(--g3);margin-top:-4px;opacity:0;transition:opacity .3s}
.cn.now .sic{background:var(--fg);color:#000;transform:scale(1.08)}
.cn.now b{color:var(--fg);font-weight:700}
.cn.now small{opacity:1}

/* 단계별 경고 설정 */
/* 경고 설정: 내용과 적용 버튼의 높이 경쟁을 끊어 짧은 모바일에서도 CTA를 항상 노출 */
#s-alert{overflow:hidden;padding:0 22px;padding-bottom:0}
.alert-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:12px 0 18px}
.alert-scroll::-webkit-scrollbar{display:none}
#s-alert .obar{height:40px;flex:none;margin:0 0 16px}
#s-alert .ob{width:40px;height:40px}
#s-alert h1{font-size:30px;line-height:1.25;margin-top:1px}
#s-alert .eyebrow{font-size:13px;margin-bottom:5px}
.alert-desc{margin:8px 0 0;color:var(--g4);font-size:13px;line-height:1.5}
.level-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:20px 0 14px}
.level{border-radius:19px;background:var(--g1);text-align:left;padding:12px 12px;min-height:74px;display:flex;flex-direction:row;align-items:center;gap:12px;transition:background .3s var(--e),color .3s var(--e),transform .18s}
.level:active{transform:scale(.98)}
.level strong{font-size:26px;line-height:1;font-weight:800;letter-spacing:-.04em;min-width:22px}
.level .level-title{font-size:14px;line-height:1.35;font-weight:700;white-space:nowrap}
.level .level-caption{display:none}
.level.sel{background:var(--fg);color:#000}
.alert-config{border-radius:20px;background:var(--g1);padding:15px;margin-bottom:0}
.alert-config label,.cfg-label{font-size:13px;color:var(--g4);font-weight:600;display:block;margin:0 0 8px}
.warn-input{width:100%;height:46px;border:0;background:var(--g2);border-radius:13px;padding:0 13px;font:inherit;font-size:14px;color:var(--fg);outline:none;letter-spacing:inherit}
.warn-input:focus-visible{outline:1px solid var(--g4)}
.cfg-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:17px}
.cfg-heading .cfg-label{margin:0}
.cfg-heading small{font-size:11px;color:var(--g3)}
.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.feedback-item{min-height:46px;padding:0 12px;background:var(--g2);border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--g4);font-size:13px;font-weight:600;transition:background .3s,color .3s}
.feedback-item svg{width:18px;height:18px}
.feedback-item.sel{background:var(--fg);color:#000}
.alert-footer{flex:none;position:relative;padding:10px 0 max(18px,env(safe-area-inset-bottom,0px));background:var(--bg);z-index:1}
#s-alert .cta{margin:0;flex:none;height:56px}
@media(max-height:620px){#s-alert .alert-scroll{padding-top:7px}#s-alert .obar{margin-bottom:12px}#s-alert h1{font-size:27px}.level-grid{margin-top:14px;margin-bottom:12px}.level{min-height:68px}.alert-config{padding:13px}.alert-footer{padding-top:8px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}}

/* 1단계: 헤드업 알림 시연 */
.heads{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;z-index:34;opacity:0;transform:translateY(-120%) scale(.96);pointer-events:none;transition:opacity .35s,transform .5s var(--e)}
.heads.on{opacity:1;transform:none;pointer-events:auto}
.head-panel{background:#2b2b2b;border-radius:22px;padding:14px 16px 12px;box-shadow:0 12px 36px #000a}
.head-brand{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#c5c5c5}
.head-brand svg{width:16px;height:16px}
.head-message{font-size:15px;font-weight:750;margin:9px 0 4px}
.head-detail{font-size:12px;color:var(--g4)}
.head-actions{display:flex;justify-content:flex-end;gap:18px;margin-top:12px}
.head-actions button{font-size:13px;font-weight:700;color:var(--fg)}
.head-actions button:first-child{color:var(--g4)}

/* 2단계: 상단에 가볍게 떠오르는 대칭 눈과 부드러운 그림자 */
.watch{position:absolute;inset:0;z-index:25;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 22px;text-align:center;opacity:0;pointer-events:none;transition:opacity .48s ease}
.watch::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.93) 0%,rgba(0,0,0,.88) 15%,rgba(0,0,0,.78) 27%,rgba(0,0,0,.55) 36%,rgba(0,0,0,.18) 48%,rgba(0,0,0,0) 60%)}
.watch::after{content:"";position:absolute;pointer-events:none;top:-125px;left:50%;width:min(110vw,460px);height:380px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.095),rgba(255,255,255,.035) 29%,transparent 65%);opacity:0;transition:opacity 1s ease}
.watch.on{opacity:1;pointer-events:auto}
.watch.on::after{opacity:1}
.watch-content{position:relative;z-index:1;width:100%;margin:0;padding-top:clamp(48px,11vh,100px);transform:translateY(-8px);transition:transform .75s var(--e)}
.watch.on .watch-content{transform:none}
.eye-character{width:min(40%,140px);margin:0 auto 18px;filter:drop-shadow(0 0 15px rgba(255,255,255,.10))}
.eye-character svg{display:block;width:100%;overflow:visible}
.eye-lid{transform-origin:center;transform-box:fill-box;transform:scaleY(.035)}
.watch.on .eye-lid{animation:eye-open .85s var(--e) .15s 1 both}
.eye-pupil{transform:translate(var(--gx,0px),var(--gy,0px));transition:transform .65s var(--e)}
@keyframes eye-open{0%{transform:scaleY(.035)}68%{transform:scaleY(1.05)}100%{transform:scaleY(1)}}
.watch-kicker,.watch-time,.watch-help{display:none}
.watch h2{font-size:14px;font-weight:500;line-height:1.5;letter-spacing:-.012em;color:#bcbcbc;margin:0 auto;max-width:340px;overflow-wrap:anywhere}
/* 4단계: 카운트다운 */
.count-layer{position:absolute;inset:0;z-index:27;background:rgba(0,0,0,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s ease}
.count-layer.on{opacity:1;pointer-events:auto}
.count-layer .count-label{font-size:15px;color:var(--g4);margin:0 0 6px}
.count-layer strong{font-size:min(45vw,170px);line-height:1.35;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.08em;animation:count-breath .9s ease both}
@keyframes count-breath{from{transform:scale(1.12);opacity:.55}to{transform:scale(1);opacity:1}}
.count-layer .count-caption{font-size:14px;color:var(--g4)}
.count-layer .count-cancel{position:absolute;bottom:45px;font-size:13px;color:var(--g3);padding:12px}

/* 4단계: 발작 — 흔들림 + 플래시 + 글리치 숫자. 플래시는 초당 2.5회(광과민성 기준선 3회 미만) */
.flash{position:absolute;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none}
.warning-stripes{position:absolute;inset:0;z-index:29;opacity:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(255,255,255,.07) 3px,rgba(255,255,255,.07) 4px)}
.app.seizure-active{animation:shake .11s linear infinite}
.app.seizure-burst .flash{animation:fl .4s ease-out 3}
.app.seizure-active .warning-stripes{opacity:1;animation:scan .3s steps(3) infinite}
.app.seizure-active .count-layer{background:#000}
.app.seizure-active #count-number{position:relative;z-index:1;font-size:min(55vw,200px);text-shadow:-9px 3px 0 rgba(255,255,255,.32),9px -3px 0 rgba(255,255,255,.16);animation:glitch .16s steps(2) infinite}
.app.seizure-active .count-label{position:relative;z-index:1;font-size:19px;font-weight:800;color:#fff}
.app.seizure-active .count-caption{position:relative;z-index:1;color:#bbb}
.app.seizure-active .count-cancel{z-index:31;color:#bbb;background:#222;padding:12px 20px;border-radius:30px}
@keyframes shake{25%{transform:translate(-8px,3px) rotate(-.7deg)}50%{transform:translate(7px,-4px) rotate(.4deg)}75%{transform:translate(-5px,-2px) rotate(.6deg)}}
@keyframes fl{0%{opacity:.85}35%,100%{opacity:0}}
@keyframes glitch{0%{transform:translate(-7px,2px) skewX(-7deg)}100%{transform:translate(7px,-2px) skewX(6deg)}}
@keyframes scan{to{background-position:0 12px}}

/* 앱 추가 플로우 */
.cta.ghost{background:var(--g2);color:var(--g4)}
.achip{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px 0 16px;border-radius:999px;background:var(--g1);font-size:15px;font-weight:700}
.achip .tile{width:auto;height:auto;background:none;border-radius:0}
.achip .tile svg{width:18px;height:18px}
.anum{width:34px;height:34px;border-radius:50%;background:var(--g2);display:grid;place-items:center;font-size:14px;font-weight:800}
.ascroll{flex:1;min-height:0;overflow-y:auto;margin:0 -22px;padding:0 22px 16px;scrollbar-width:none}
.ascroll::-webkit-scrollbar{display:none}
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 10px;margin-top:30px}
.ag{display:flex;flex-direction:column;align-items:center;gap:10px}
.ag .tile{width:78px;height:78px;border-radius:25px;background:var(--g1);transition:background .25s,color .25s,transform .4s var(--e)}
.ag .tile svg{width:34px;height:34px}
.ag b{font-size:14px;font-weight:600;color:var(--g4);transition:color .25s}
.ag:active .tile{transform:scale(.92)}
.ag.pick .tile{background:var(--fg);color:#000;transform:scale(1.07)}
.ag.pick b{color:var(--fg)}
.aempty{grid-column:1/-1;text-align:center;color:var(--g3);font-size:14px;padding:70px 0}
.tbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:30px}
#s-add-time .mgrid{margin-top:0}
#s-add-time .pzone{height:214px;margin-top:20px}
#s-add-time .wheel{height:200px}
#s-add-time .wheel .pad{height:80px}
.slist{display:flex;flex-direction:column;gap:8px;position:relative}
#sl-on{margin-top:26px}
.sw{position:relative;border-radius:20px;background:#191919;transition:height .3s var(--e),opacity .3s,margin .3s}
.sw-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;gap:7px;padding-right:22px;color:var(--g4);font-size:14px;font-weight:600}
.sw-bg svg.i{width:19px;height:19px}
.srow3{position:relative;display:flex;align-items:center;gap:14px;height:68px;padding:0 8px 0 18px;background:var(--g1);border-radius:20px;touch-action:pan-y;transition:transform .35s var(--e),background .25s,box-shadow .25s;user-select:none;-webkit-user-select:none}
.srow3 strong{font-size:26px;font-weight:800;letter-spacing:-.04em;min-width:20px;font-variant-numeric:tabular-nums}
.srow3 .t{flex:1;min-width:0}
.srow3 .t b{display:block;font-size:16px;font-weight:700}
.srow3 .t small{display:block;font-size:12px;color:var(--g3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sic{width:36px;height:36px;border-radius:50%;background:var(--g2);display:grid;place-items:center;flex:none}
.sic svg.i{width:18px;height:18px}
.sw.ex .sic{opacity:.4}
.vibrow{display:flex;align-items:center;gap:14px;height:56px;margin-top:12px;padding:0 6px 0 4px;background:none}
.vibrow b{flex:1;font-size:16px;font-weight:700}
.srow3 .t b{display:flex;align-items:center;gap:7px}
.srow3 .t b svg.i,.vibrow b svg.i{width:17px;height:17px;flex:none}
.vibrow b{display:flex;align-items:center;gap:7px}
.vibrow{padding-left:18px}
.lic2{width:24px;display:grid;place-items:center;flex:none}
.lic2 svg.i{width:22px;height:22px}
.sw.ex .lic2{opacity:.4}
.achip>svg.i{width:18px;height:18px;flex:none}
#s-add-stage .ascroll{-webkit-mask-image:linear-gradient(#000 calc(100% - 32px),transparent);mask-image:linear-gradient(#000 calc(100% - 32px),transparent)}
#s-add-stage .cta{margin-top:6px}
#sl-on{margin-top:22px}
.level .level-title{display:flex;align-items:center;gap:6px}
.level .level-title svg.i{width:17px;height:17px;flex:none}
.edb{height:32px;padding:0 13px;border-radius:999px;background:var(--g2);font-size:13px;font-weight:600;flex:none}
.edb:active{background:#2e2e2e}
.grip{width:38px;height:52px;display:grid;place-items:center;color:var(--g3);touch-action:none;cursor:grab;flex:none}
.grip svg.i{width:20px;height:20px}
.sw.drag{z-index:5}
.sw.drag .srow3{background:var(--g2);box-shadow:0 16px 36px #000d;transform:scale(1.025)}
.sw.shift{transition:transform .3s var(--e)}
.slabel{font-size:13px;color:var(--g3);font-weight:600;margin:24px 0 10px}
.sw.ex{background:none}
.sw.ex .srow3{background:#0d0d0d;cursor:pointer}
.sw.ex .t,.sw.ex strong{opacity:.4}
.addb{width:36px;height:36px;margin-right:6px;border-radius:50%;background:var(--g2);display:grid;place-items:center;flex:none}
.addb svg.i{width:18px;height:18px}
.sw.nudge .srow3{animation:nudge 1.4s var(--e) .7s both}
@keyframes nudge{0%,100%{transform:none}35%,55%{transform:translateX(-92px)}}
.sw.deny .srow3{animation:deny .4s}
@keyframes deny{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* 경고 문구 수정 + 미리보기 */
.pv{position:relative;height:min(44vh,330px);border-radius:28px;background:#0a0a0a;overflow:hidden;flex:none;cursor:text}
.pv-bg{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;gap:10px;opacity:.55}
.pv-bg i{display:block;border-radius:14px;background:var(--g1)}
.pv-bg i:nth-child(1){height:48%}.pv-bg i:nth-child(2){height:11%;width:72%}.pv-bg i:nth-child(3){height:11%;width:46%}
.pv-msg{margin:0;border-radius:8px;transition:background .3s,box-shadow .3s;overflow-wrap:anywhere}
.pv.focus .pv-msg{background:rgba(255,255,255,.08);box-shadow:0 0 0 5px rgba(255,255,255,.08)}
.pv-heads{position:absolute;top:14px;left:12px;right:12px;background:#2b2b2b;border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px #000a;animation:pvdrop .6s var(--e) .1s both}
.pv-heads .hb{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#c5c5c5}
.pv-heads .hb svg.i{width:14px;height:14px}
.pv-heads .pv-msg{font-size:14px;font-weight:700;margin:8px 0 3px}
.pv-heads span{font-size:11px;color:var(--g4)}
@keyframes pvdrop{from{transform:translateY(-130%)}}
.pv-watch{position:absolute;inset:0;background:linear-gradient(#000 0%,rgba(0,0,0,.88) 42%,transparent 78%);display:flex;flex-direction:column;align-items:center;padding:34px 26px 0;text-align:center;animation:pvfade .5s both}
.pv-eyes{width:40%;margin-bottom:14px}
.pv-eyes svg{display:block;width:100%;overflow:visible}
.pv-eyes .pp{animation:look 3.2s ease-in-out infinite}
.pv-eyes .pr{animation-name:lookr}
@keyframes look{0%,15%,85%,100%{transform:none}30%,45%{transform:translateX(-11px)}60%,75%{transform:translateX(11px)}}
@keyframes lookr{0%,15%,85%,100%{transform:none}30%,45%{transform:translateX(11px)}60%,75%{transform:translateX(-11px)}}
.pv-watch .pv-msg{font-size:14px;color:#c4c4c4;line-height:1.5}
.pv-pop{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:22px;animation:pvfade .4s both}
.pv-card{width:100%;background:var(--g1);border-radius:22px;padding:22px 18px 16px;text-align:center;animation:pvpop .5s var(--e) both}
.pv-card .pv-msg{font-size:17px;font-weight:800;line-height:1.35}
.pv-card span{display:block;font-size:12px;color:var(--g4);margin:6px 0 16px}
.pv-card i{display:block;font-style:normal;height:42px;line-height:42px;border-radius:999px;background:var(--fg);color:#000;font-size:14px;font-weight:700}
@keyframes pvpop{from{transform:scale(.9);opacity:0}}
@keyframes pvfade{from{opacity:0}}
.pv-seize{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22px;animation:pvshake .14s linear infinite}
.pv-seize .pv-msg{font-size:15px;font-weight:800;color:#fff}
.pv-seize strong{font-size:110px;line-height:1.2;font-weight:800;letter-spacing:-.06em;text-shadow:-6px 2px 0 rgba(255,255,255,.28),6px -2px 0 rgba(255,255,255,.14)}
.pv-seize span{font-size:12px;color:var(--g4)}
@keyframes pvshake{25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}
.pv-play{position:absolute;right:12px;bottom:12px;z-index:3;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:var(--fg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pv-play svg.i{width:18px;height:18px}
.ed-in{margin-top:14px;height:52px;font-size:15px;border-radius:16px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{height:34px;padding:0 13px;border-radius:999px;background:var(--g1);color:var(--g4);font-size:13px;font-weight:600;transition:background .2s,color .2s}
.chip:active{background:var(--g2);color:var(--fg)}

/* 완료 바텀 알림 */
.dnote{position:absolute;left:14px;right:14px;bottom:100px;z-index:38;display:flex;align-items:center;gap:14px;padding:16px 16px 16px 14px;border-radius:24px;background:#1c1c1c;text-align:left;box-shadow:0 16px 40px #000c;transform:translateY(150%);opacity:0;transition:transform .65s var(--e),opacity .3s;pointer-events:none;overflow:hidden}
.dnote.on{transform:none;opacity:1;pointer-events:auto}
.dck{width:40px;height:40px;flex:none}
.dck svg{width:40px;height:40px;fill:none;stroke:var(--fg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.dck circle{stroke-dasharray:107;stroke-dashoffset:107;transform:rotate(-90deg);transform-origin:20px 20px}
.dck path{stroke-dasharray:24;stroke-dashoffset:24}
.dnote.on .dck circle{animation:draw .6s var(--e) .25s forwards}
.dnote.on .dck path{animation:draw .4s var(--e) .75s forwards}
.dnote.on .dck{animation:dpop .5s var(--e) 1.05s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dpop{50%{transform:scale(1.14)}}
.dtx{flex:1;min-width:0}
.dtx b{display:block;font-size:15px;font-weight:700}
.dtx small{display:block;font-size:12px;color:var(--g4);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnote>svg.i{color:var(--g3);width:20px;height:20px;flex:none}
.dnote::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--g3);transform-origin:left;transform:scaleX(0)}
.dnote.on::after{animation:dbar 2.8s linear forwards}
@keyframes dbar{to{transform:scaleX(1)}}

/* overlay */
.ov{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:28px;opacity:0;pointer-events:none;transition:opacity .3s ease}
.ov.on{opacity:1;pointer-events:auto}
.ovc{width:100%;background:var(--g1);border-radius:26px;padding:26px 22px 18px;text-align:center;transform:scale(.92);transition:transform .45s var(--e)}
.ov.on .ovc{transform:none}
.ovc .tile{width:60px;height:60px;border-radius:19px;margin:0 auto 18px}
.ovc h3{font-size:21px;font-weight:800;margin:0;line-height:1.35}
.ovc p{color:var(--g4);font-size:14px;margin:8px 0 22px}
.ovc .lnk{display:block;width:100%;padding:14px 0 4px;color:var(--g3);font-size:14px}

.toast{position:absolute;left:50%;bottom:28px;z-index:40;transform:translate(-50%,20px);background:var(--g2);color:var(--fg);font-size:14px;padding:12px 18px;border-radius:999px;opacity:0;white-space:nowrap;transition:all .4s var(--e);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* bottom sheet */
.shbg{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .35s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:16;background:var(--g1);border-radius:30px 30px 0 0;padding:10px 20px 20px;transform:translateY(105%);transition:transform .5s var(--e);touch-action:none}
.app.sh-on .shbg{opacity:1;pointer-events:auto}
.app.sh-on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--g3);margin:0 auto 24px;opacity:.7}
.sheet h3{font-size:25px;font-weight:800;margin:0;letter-spacing:-.04em}
.sheet p{font-size:14px;color:var(--g4);margin:8px 0 22px}
.sr{display:flex;width:100%;align-items:center;justify-content:space-between;height:60px;padding:0 18px 0 20px;border-radius:20px;background:var(--g2);font-size:16px;font-weight:700;margin-bottom:8px;transition:transform .15s}
.sr:active{transform:scale(.98)}
.sr svg.i{color:var(--g4);width:20px;height:20px}
.sr.dz{background:none;color:var(--g4);font-weight:500;height:44px;justify-content:center;margin-bottom:4px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* 경고 설정: 단계 번호 + 명칭, 별도 효과 옵션 없음 */
.level{min-height:88px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;padding:15px}
.level .level-title{font-size:16px;white-space:normal}
.level small{font-size:12px;line-height:1.35;color:var(--g4);font-weight:400}
.level.sel small{color:#555}
.escalate-row{display:flex;align-items:center;justify-content:space-between;gap:15px;background:var(--g1);border-radius:19px;padding:15px 16px;margin-bottom:10px}
.escalate-row span{min-width:0}
.escalate-row b{display:block;font-size:14px}
.escalate-row small{display:block;font-size:12px;color:var(--g4);margin-top:5px;line-height:1.4}
.switch{width:47px;height:28px;border-radius:30px;background:var(--g2);flex:none;padding:3px;transition:background .25s;display:flex;align-items:center}
.switch i{width:22px;height:22px;border-radius:50%;background:var(--g4);display:block;transition:transform .25s,background .25s}
.switch.on{background:var(--fg)}
.switch.on i{background:#000;transform:translateX(19px)}
#strong-config .cfg-heading{margin:0}
#strong-config{transition:opacity .3s,transform .3s}
#strong-config.unavailable{opacity:.4}
@media(max-height:620px){.level{min-height:72px;padding:11px}.level-grid{gap:8px;margin-top:12px}.escalate-row{padding:12px 14px}}
</style>
</head>

              <use href="#eye-half"/>

  <!-- 4단계: 기본 오버레이 / 3단계 이후 안내 -->

  <div class="toast" id="toast"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const ic=p=>`<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
const CHECK='<path d="M6 12.5l4 4 8-9"/>';

const APPS=[

function updFlow(){
  const mid=flow.getBoundingClientRect().left+flow.clientWidth/2;
  let closest=Infinity;
  fis.forEach((it,i)=>{
    // transform 영향을 받지 않는 실제 레이아웃 중심 좌표
    const center=flow.getBoundingClientRect().left+it.offsetLeft-flow.scrollLeft+it.offsetWidth/2;
    const distance=Math.abs(center-mid)/136;
    it.style.transform=`scale(${Math.max(.55,1-distance*.22)})`;
    it.style.opacity=Math.max(.2,1-distance*.4);
    if(Math.abs(center-mid)<closest){closest=Math.abs(center-mid);centerIdx=i}
  });
  fis.forEach((it,i)=>it.classList.toggle('c',i===centerIdx));
  updCount();
}

const pad2=n=>String(n).padStart(2,'0');

function wheel(el,vals,label,idx,cb){
  el.innerHTML='<div class="pad"></div>'+vals.map((v,i)=>`<div class="w" data-i="${i}">${label(v)}</div>`).join('')+'<div class="pad"></div>';
  const ws=[...el.querySelectorAll('.w')];
  let last=-1;
  const upd=()=>{const i=Math.max(0,Math.min(vals.length-1,Math.round(el.scrollTop/40)));if(i!==last){ws[last]?.classList.remove('sel');ws[i].classList.add('sel');last=i;cb(vals[i])}};
  el.scrollTop=idx*40;upd();
  el.onscroll=()=>requestAnimationFrame(upd);

}

}

const DEF_MSG=['{앱} {사용시간}째 쓰는 중이야','아직도 {앱} 보고 있어?','이제 잠깐 쉬어갈 시간이야','그만 봐. {앱} 닫는다'];

}
function stopHaptic(){if(typeof navigator.vibrate==='function')navigator.vibrate(0)}
const baseMessage=()=>S.message.trim()||'이제 잠깐 쉬어갈 시간이야';
const elapsed=a=>`오늘 사용 ${fmt(a.mins)}`;
let headTimer=null,eyeTimers=[],countTimer=null,activeWarnId=null,warnSandbox=false,warnVib=true;
function stopTimers(){
  clearTimeout(headTimer);headTimer=null;
  eyeTimers.forEach(clearTimeout);eyeTimers=[];
  clearInterval(countTimer);countTimer=null;
  stopHaptic();
}
function hideWarnings(){
  stopTimers();$('heads').classList.remove('on');$('watch').classList.remove('on');
  $('ov').classList.remove('on');$('count-layer').classList.remove('on');
  app.classList.remove('seizure-active','seizure-burst');
}
function ignored(id){
  hideWarnings();if(warnSandbox)return;
  const c=cfgOf(id),i=stageIdx(id),ni=Math.min(c.order.length-1,i+1);
  S.stageByApp[id]=ni;
  toast(ni===i?'경고를 닫았어요':`다음 경고: ${STAGE_NAMES[c.order[ni]]}`);
  if(cur==='s-detail'&&dId===id)document.querySelectorAll('#dbody .cn').forEach((e,j)=>e.classList.toggle('now',j===ni));
}
function stopped(id){
  hideWarnings();if(warnSandbox)return;S.stageByApp[id]=0;
  if(cur!=='s-home')go('s-home',true);
  toast('이번 사용을 멈췄어요');
}
function triggerWarning(a,{preview=true,usageMinutes=a.mins,now=new Date(),stage=null,cfg=null,sandbox=false}={}){
  const c=cfg||cfgOf(a.id);
  if(!preview&&!conditionMet(usageMinutes,now,c))return false;
  if(!preview&&!S.on[a.id])return false;
  hideWarnings();activeWarnId=a.id;warnSandbox=sandbox;warnVib=c.vib!==false;
  clearTimeout(tt);$('toast').classList.remove('on');
  const k=stage??currentStage(a.id),msg=msgFor(a,k,c);
  if(warnVib&&k<3)navigator.vibrate?.([70,50,70]);
  [showHeads,showWatch,showPopup,showCountdown][k](a,msg);
  return true;
}
function showHeads(a,msg){
  $('head-message').textContent=msg;
  $('head-detail').textContent=`${a.name} · ${elapsed(a)}`;
  $('heads').classList.add('on');
  headTimer=setTimeout(()=>ignored(a.id),6500);
}
$('b-head-ignore').onclick=()=>{if(activeWarnId)ignored(activeWarnId)};
$('b-head-stop').onclick=()=>{if(activeWarnId)stopped(activeWarnId)};
function moveEyes(x,y){
  document.querySelectorAll('.eye-pupil').forEach(e=>{
    const direction=e.dataset.eye==='right'?-1:1;
    e.style.setProperty('--gx',`${x*direction}px`);
    e.style.setProperty('--gy',`${y}px`);
  });
}
function showWatch(a,msg){
  $('watch-app').textContent=`${a.name} · 2단계 경고`;
  $('watch-msg').textContent=msg;
  $('watch-time').textContent='';
  moveEyes(0,0);
  $('watch').classList.remove('on');
  void $('watch').offsetWidth;
  $('watch').classList.add('on');
  // 한 번 깜빡이고 → 왼쪽 → 오른쪽 → 정면을 바라본 뒤 정지.
  eyeTimers=[
    setTimeout(()=>moveEyes(-11,0),750),
    setTimeout(()=>moveEyes(11,0),1600),
    setTimeout(()=>moveEyes(0,0),2450)
  ];
}
$('watch').addEventListener('click',()=>{
  if(activeWarnId)ignored(activeWarnId);
});
function showPopup(a,msg){
  $('ovc').innerHTML=`<h3 id="modal-head"></h3><p id="modal-sub"></p><button class="cta" id="b-ok">앱에서 나가기</button><button class="lnk" id="b-ign">무시하고 계속하기</button>`;
  $('modal-head').textContent=msg;
  $('modal-sub').textContent=`${a.name} · ${elapsed(a)}`;
  $('ov').classList.add('on');
  $('b-ok').onclick=()=>stopped(a.id);
  $('b-ign').onclick=()=>ignored(a.id);
}
function showCountdown(a,msg){
  $('count-label').textContent=msg;$('count-cap').textContent=`${a.name} 오늘 ${fmt(a.mins)}`;
  $('count-number').textContent='3';$('count-layer').classList.add('on');
  app.classList.add('seizure-active');
  countdownHaptic();
  let n=3;
  countTimer=setInterval(()=>{
    n--;
    if(n>0)countdownHaptic();
    if(n===0){
      clearInterval(countTimer);
      $('count-number').textContent='';app.classList.add('seizure-burst');
      if(warnVib&&typeof navigator.vibrate==='function')navigator.vibrate(1200);
      countTimer=setTimeout(()=>{countTimer=null;completeCountdown(a)},1200);return;
    }
    const e=$('count-number');e.textContent=String(n);
    e.style.animation='none';void e.offsetWidth;e.style.animation='';
  },1000);
}
$('b-count-cancel').onclick=()=>{if(activeWarnId)ignored(activeWarnId)};
function completeCountdown(a){
  const sb=warnSandbox;hideWarnings();if(sb)return;S.stageByApp[a.id]=0;
  if(cur!=='s-home')go('s-home',true);
  $('ovc').innerHTML=`<h3>잠깐, 여기까지</h3><p>${a.name}에서 나왔어요.</p><button class="cta" id="b-end-close">확인</button>`;
  $('ov').classList.add('on');
  $('b-end-close').onclick=()=>$('ov').classList.remove('on');
}
</script>
</body>
